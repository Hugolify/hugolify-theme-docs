<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "headline": {{ partial "func/PrepareData.html" .Title }},
    
  {{- with .Params.image }}
    {{- $schemaImage := .src | absURL -}}
    {{- if templates.Exists "partials/func/GetSchemaImageSrc.html" }}{{ $schemaImage = partial "func/GetSchemaImageSrc.html" .src }}{{ end }}
    "image": {{ $schemaImage }},
  {{- end -}}

  {{ with .Date }}
    "datePublished": {{ . }},
  {{- end -}}

  {{ with .Params.description }}
    "abstract": {{ partial "func/PrepareData.html" . }},
  {{- end -}}

  {{ with .Content }}
    "description": {{ partial "func/PrepareData.html" . }},
  {{- end -}}
  }
</script>
